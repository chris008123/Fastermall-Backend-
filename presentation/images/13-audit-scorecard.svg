<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="start" dominant-baseline="middle">AREA</text><text x="560" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">GRADE</text><text x="660" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="start" dominant-baseline="middle">WHY</text><rect x="40" y="70" width="1520" height="68" rx="12" fill="#F0F8F9"/><text x="60" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Payments &amp; money safety</text><rect x="515" y="80" width="90" height="48" rx="24" fill="#2E7D4F"/><text x="560" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Server-side prices, signed webhooks, re-verified amounts, no double charging</text><rect x="40" y="150" width="1520" height="68" rx="12" fill="#FFFFFF"/><text x="60" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Login &amp; access control</text><rect x="515" y="160" width="90" height="48" rx="24" fill="#2E7D4F"/><text x="560" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Roles, revocable staff sessions, lockouts, rate limits</text><rect x="40" y="230" width="1520" height="68" rx="12" fill="#F0F8F9"/><text x="60" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Automated tests</text><rect x="515" y="240" width="90" height="48" rx="24" fill="#2E7D4F"/><text x="560" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">708 tests in 49 suites, all passing; type check clean</text><rect x="40" y="310" width="1520" height="68" rx="12" fill="#FFFFFF"/><text x="60" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Code structure</text><rect x="515" y="320" width="90" height="48" rx="24" fill="#2E7D4F"/><text x="560" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A−</text><text x="660" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">18 clear departments, shared rules in one place</text><rect x="40" y="390" width="1520" height="68" rx="12" fill="#F0F8F9"/><text x="60" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Database changes</text><rect x="515" y="400" width="90" height="48" rx="24" fill="#B7791F"/><text x="560" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B+</text><text x="660" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">39 additive migrations; 3 newest not yet tried on a real database</text><rect x="40" y="470" width="1520" height="68" rx="12" fill="#FFFFFF"/><text x="60" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Settings &amp; config</text><rect x="515" y="480" width="90" height="48" rx="24" fill="#B7791F"/><text x="560" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B</text><text x="660" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">One documented setting (payment timeout) is silently ignored</text><rect x="40" y="550" width="1520" height="68" rx="12" fill="#F0F8F9"/><text x="60" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Operations &amp; recovery</text><rect x="515" y="560" width="90" height="48" rx="24" fill="#B7791F"/><text x="560" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B</text><text x="660" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Failed automatic refunds are only written to the server log</text><rect x="40" y="630" width="1520" height="68" rx="12" fill="#FFFFFF"/><text x="60" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Documentation</text><rect x="515" y="640" width="90" height="48" rx="24" fill="#B7791F"/><text x="560" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B</text><text x="660" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Very detailed, but README still calls modules “stubbed”</text><rect x="40" y="710" width="1520" height="68" rx="12" fill="#F0F8F9"/><text x="60" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Third-party libraries</text><rect x="515" y="720" width="90" height="48" rx="24" fill="#B83227"/><text x="560" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">C</text><text x="660" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">16 known vulnerabilities (2 critical, 7 high); framework upgrade due</text></svg>