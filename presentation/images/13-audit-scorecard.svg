<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="start" dominant-baseline="middle">AREA</text><text x="560" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">GRADE</text><text x="660" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5B6B73" text-anchor="start" dominant-baseline="middle">WHY</text><rect x="40" y="66" width="1520" height="62" rx="12" fill="#F0F8F9"/><text x="60" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Payments &amp; money safety</text><rect x="515" y="74" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Server-side prices, signed webhooks, refunds locked against double clicks</text><rect x="40" y="139" width="1520" height="62" rx="12" fill="#FFFFFF"/><text x="60" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Login &amp; access control</text><rect x="515" y="147" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Roles, revocable sessions, lockouts; staff refused on customer routes (403)</text><rect x="40" y="212" width="1520" height="62" rx="12" fill="#F0F8F9"/><text x="60" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Automated tests</text><rect x="515" y="220" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">743 tests in 52 suites, all passing; type check and build clean</text><rect x="40" y="285" width="1520" height="62" rx="12" fill="#FFFFFF"/><text x="60" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Code structure</text><rect x="515" y="293" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A−</text><text x="660" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">18 clear departments, shared rules in one place</text><rect x="40" y="358" width="1520" height="62" rx="12" fill="#F0F8F9"/><text x="60" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Database changes</text><rect x="515" y="366" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A−</text><text x="660" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">All 40 migrations run on a test database: no drift, laundry data moved</text><rect x="40" y="431" width="1520" height="62" rx="12" fill="#FFFFFF"/><text x="60" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Settings &amp; config</text><rect x="515" y="439" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="463" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Payment timeout setting now works; unsafe settings stop start-up</text><rect x="40" y="504" width="1520" height="62" rx="12" fill="#F0F8F9"/><text x="60" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Operations &amp; recovery</text><rect x="515" y="512" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A−</text><text x="660" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Failed refunds alert every admin and appear in a “needs refund” list</text><rect x="40" y="577" width="1520" height="62" rx="12" fill="#FFFFFF"/><text x="60" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Photos &amp; storage</text><rect x="515" y="585" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text><text x="660" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Uploads converted to WebP, resized, GPS removed, with thumbnails</text><rect x="40" y="650" width="1520" height="62" rx="12" fill="#F0F8F9"/><text x="60" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Documentation</text><rect x="515" y="658" width="90" height="46" rx="23" fill="#2E7D4F"/><text x="560" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A−</text><text x="660" y="681" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">README, deployment checklist and API notes up to date</text><rect x="40" y="723" width="1520" height="62" rx="12" fill="#FFFFFF"/><text x="60" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Third-party libraries</text><rect x="515" y="731" width="90" height="46" rx="23" fill="#B7791F"/><text x="560" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B−</text><text x="660" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="19.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">11 known weaknesses left (0 critical, was 16); NestJS upgrade due</text></svg>