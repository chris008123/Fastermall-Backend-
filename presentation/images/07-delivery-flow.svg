<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="800" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B4F5C" text-anchor="middle" dominant-baseline="middle">A DELIVERY JOB, AS THE PARTNER SEES IT</text><rect x="30" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#5B6B73" stroke-width="3"/><text x="128" y="157.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Waiting</text><text x="128" y="188.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">New job is announced to</text><text x="128" y="209.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">partners</text><defs><marker id="auxj3s5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M228,182.5 L252,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#auxj3s5)"/><rect x="254" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="3"/><text x="352" y="147.29999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Claimed</text><text x="352" y="178.29999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">First partner to claim</text><text x="352" y="199.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">gets it (no</text><text x="352" y="219.89999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">double-booking)</text><defs><marker id="arzt1w8" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M452,182.5 L476,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#arzt1w8)"/><rect x="478" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="576" y="155.5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Heading to</text><text x="576" y="180.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">the shop</text><text x="576" y="211.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">on the way to collect</text><defs><marker id="adqneji" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M676,182.5 L700,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#adqneji)"/><rect x="702" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="800" y="168.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Paying vendor</text><text x="800" y="199.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">optional: pays the shop</text><defs><marker id="a7pthep" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M900,182.5 L924,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a7pthep)"/><rect x="926" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="1024" y="168.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Picked up</text><text x="1024" y="199.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Parcel collected</text><defs><marker id="ar5xx7b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1124,182.5 L1148,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ar5xx7b)"/><rect x="1150" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="1248" y="155.5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Heading to</text><text x="1248" y="180.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">the customer</text><text x="1248" y="211.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">on the way to drop off</text><defs><marker id="an1pq2z" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1348,182.5 L1372,182.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#an1pq2z)"/><rect x="1374" y="100" width="196" height="165" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1472" y="157.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Delivered</text><text x="1472" y="188.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Only with the</text><text x="1472" y="209.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">customer’s 6-digit code</text><text x="800" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Steps can only go forward, one at a time. Skipping or going backwards is refused.</text><rect x="30" y="345" width="740" height="205" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="400" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F7A8C" text-anchor="middle" dominant-baseline="middle">THE HANDOVER CODE</text><text x="400" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">A 6-digit code is made when the order is placed.</text><text x="400" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Only the customer can see it in their app.</text><text x="400" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">It is stored scrambled (hashed + encrypted).</text><text x="400" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Too many wrong guesses locks it for a while.</text><rect x="830" y="345" width="740" height="205" rx="18" fill="#FDEBDC" stroke="#E07B2A" stroke-width="2"/><text x="1200" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#E07B2A" text-anchor="middle" dominant-baseline="middle">WHO GETS THE JOB</text><text x="1200" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Up to 2 km: a walking partner can take it.</text><text x="1200" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Further: a motorcycle partner.</text><text x="1200" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Partners must be online (and verified, if turned on).</text><text x="1200" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Food partners carry at most 3 jobs at once.</text><rect x="70" y="610" width="320" height="90" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.5"/><text x="230" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Delivered</text><defs><marker id="av1no9d" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M392,655 L446,655" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#av1no9d)"/><rect x="450" y="610" width="320" height="90" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.5"/><text x="610" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Earning added to wallet</text><defs><marker id="asdk3l0" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M772,655 L826,655" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#asdk3l0)"/><rect x="830" y="610" width="320" height="90" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="2.5"/><text x="990" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Partner asks to cash out</text><defs><marker id="af14hh6" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1152,655 L1206,655" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#af14hh6)"/><rect x="1210" y="610" width="320" height="90" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="2.5"/><text x="1370" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Admin pays &amp; marks PAID</text><text x="800" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">THE MONEY SIDE: partners are paid a fixed amount per delivery (set by admins)</text></svg>