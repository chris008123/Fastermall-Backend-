<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="800" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#5B4B9A" text-anchor="middle" dominant-baseline="middle">A LAUNDRY ORDER GOES THROUGH 13 STAGES</text><rect x="40" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2.5"/><text x="135" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Pickup requested</text><circle cx="58" cy="124" r="16" fill="#1F7A8C"/><text x="58" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="amxkujx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M232,165 L258,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#amxkujx)"/><rect x="260" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="355" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Received</text><circle cx="278" cy="124" r="16" fill="#5B4B9A"/><text x="278" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="a7cr0kz" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M452,165 L478,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a7cr0kz)"/><rect x="480" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="575" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Inspected</text><circle cx="498" cy="124" r="16" fill="#5B4B9A"/><text x="498" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="ap482rc" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M672,165 L698,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ap482rc)"/><rect x="700" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="795" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Tagged</text><circle cx="718" cy="124" r="16" fill="#5B4B9A"/><text x="718" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="asklplk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M892,165 L918,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#asklplk)"/><rect x="920" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="1015" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Washing</text><circle cx="938" cy="124" r="16" fill="#5B4B9A"/><text x="938" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><defs><marker id="a20xjwe" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1112,165 L1138,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a20xjwe)"/><rect x="1140" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="1235" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Drying</text><circle cx="1158" cy="124" r="16" fill="#5B4B9A"/><text x="1158" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><defs><marker id="a65vb3l" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1332,165 L1358,165" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a65vb3l)"/><rect x="1360" y="120" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="1455" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Ironing</text><circle cx="1378" cy="124" r="16" fill="#5B4B9A"/><text x="1378" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">7</text><rect x="150" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="245" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Folding</text><circle cx="168" cy="334" r="16" fill="#5B4B9A"/><text x="168" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">8</text><defs><marker id="a8zgcf7" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M342,375 L368,375" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a8zgcf7)"/><rect x="370" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="465" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Quality check</text><circle cx="388" cy="334" r="16" fill="#5B4B9A"/><text x="388" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">9</text><defs><marker id="ah1axyv" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M562,375 L588,375" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ah1axyv)"/><rect x="590" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="685" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Packaged</text><circle cx="608" cy="334" r="16" fill="#5B4B9A"/><text x="608" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">10</text><defs><marker id="a2j3nmt" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M782,375 L808,375" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a2j3nmt)"/><rect x="810" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="2.5"/><text x="905" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Ready for delivery</text><circle cx="828" cy="334" r="16" fill="#E07B2A"/><text x="828" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">11</text><defs><marker id="av2y2jd" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1002,375 L1028,375" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#av2y2jd)"/><rect x="1030" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="2.5"/><text x="1125" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Out for delivery</text><circle cx="1048" cy="334" r="16" fill="#E07B2A"/><text x="1048" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">12</text><defs><marker id="aojq0ft" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1222,375 L1248,375" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aojq0ft)"/><rect x="1250" y="330" width="190" height="90" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.5"/><text x="1345" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Completed</text><circle cx="1268" cy="334" r="16" fill="#2E7D4F"/><text x="1268" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">13</text><defs><marker id="aombt55" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1455,213 C1455,280 225,260 245,325" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aombt55)"/><rect x="40" y="490" width="490" height="190" rx="18" fill="#E9E5F6" stroke="#5B4B9A" stroke-width="2"/><text x="285" y="547.85" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Many laundries, one app</text><text x="285" y="579.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Customers choose an approved, open laundry (best rated</text><text x="285" y="601.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">first) and order from its price list. They can rate it</text><text x="285" y="623.7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">after a completed order.</text><rect x="555" y="490" width="490" height="190" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="800" y="558.9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Staff only see their own</text><text x="800" y="590.55" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Laundry staff are tied to one laundry. They can only</text><text x="800" y="612.65" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">view and move orders belonging to it.</text><rect x="1070" y="490" width="490" height="190" rx="18" fill="#FDEBDC" stroke="#E07B2A" stroke-width="2"/><text x="1315" y="558.9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Customer kept informed</text><text x="1315" y="590.55" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Each stage change sends a notification. Pickup and</text><text x="1315" y="612.65" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">return trips run through the same delivery system.</text></svg>