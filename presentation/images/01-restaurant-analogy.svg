<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="40" y="110" width="400" height="520" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="240" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F7A8C" text-anchor="middle" dominant-baseline="middle">THE DINING ROOM</text><text x="240" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">= the apps people hold</text><rect x="80" y="235" width="320" height="100" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="240" y="269.3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Customer app</text><text x="240" y="303.40000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">shop, order food, laundry</text><rect x="80" y="360" width="320" height="100" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="240" y="394.29999999999995" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Delivery app</text><text x="240" y="428.4" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">riders &amp; walkers take jobs</text><rect x="80" y="485" width="320" height="100" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="240" y="519.3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Admin console</text><text x="240" y="553.4" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">the managers’ control room</text><rect x="580" y="60" width="440" height="620" rx="18" fill="#0B4F5C" stroke="#0B4F5C" stroke-width="2"/><text x="800" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">THE KITCHEN</text><text x="800" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#DCEFF2" text-anchor="middle" dominant-baseline="middle" font-style="italic">= this backend</text><rect x="620" y="200" width="360" height="70" rx="14" fill="#13606E"/><circle cx="660" cy="235" r="20" fill="#E07B2A"/><text x="660" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><text x="700" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Takes every order ticket</text><rect x="620" y="288" width="360" height="70" rx="14" fill="#13606E"/><circle cx="660" cy="323" r="20" fill="#E07B2A"/><text x="660" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><text x="700" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Checks who is asking</text><rect x="620" y="376" width="360" height="70" rx="14" fill="#13606E"/><circle cx="660" cy="411" r="20" fill="#E07B2A"/><text x="660" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><text x="700" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Applies the house rules</text><rect x="620" y="464" width="360" height="70" rx="14" fill="#13606E"/><circle cx="660" cy="499" r="20" fill="#E07B2A"/><text x="660" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><text x="700" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Works out prices itself</text><rect x="620" y="552" width="360" height="70" rx="14" fill="#13606E"/><circle cx="660" cy="587" r="20" fill="#E07B2A"/><text x="660" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><text x="700" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Tells everyone what changed</text><rect x="1160" y="110" width="400" height="250" rx="18" fill="#FDEBDC" stroke="#E07B2A" stroke-width="2"/><text x="1360" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#E07B2A" text-anchor="middle" dominant-baseline="middle">THE PANTRY</text><text x="1360" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">= the database</text><text x="1360" y="241.25" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Every customer, product, order,</text><text x="1360" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">payment and delivery is stored</text><text x="1360" y="288.75" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">here (Supabase Postgres)</text><rect x="1160" y="400" width="400" height="230" rx="18" fill="#E9E5F6" stroke="#5B4B9A" stroke-width="2"/><text x="1360" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#5B4B9A" text-anchor="middle" dominant-baseline="middle">OUTSIDE HELPERS</text><text x="1360" y="494.375" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Paystack – the cashier</text><text x="1360" y="518.125" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Email &amp; phone push – the messengers</text><text x="1360" y="541.875" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">File storage – the photo cabinet</text><text x="1360" y="565.625" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Google – the ID checker</text><defs><marker id="as7p7eu" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1F7A8C"/></marker></defs><path d="M445,330 L572,330" stroke="#1F7A8C" stroke-width="3" fill="none" marker-end="url(#as7p7eu)"/><text x="508.5" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">orders in</text><defs><marker id="a1rolk1" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1F7A8C"/></marker></defs><path d="M575,420 L448,420" stroke="#1F7A8C" stroke-width="3" fill="none" marker-end="url(#a1rolk1)"/><text x="520" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">answers out</text><defs><marker id="a833jwl" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#E07B2A"/></marker></defs><path d="M1025,235 L1152,235" stroke="#E07B2A" stroke-width="3" fill="none" marker-end="url(#a833jwl)"/><defs><marker id="a04zi4p" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B4B9A"/></marker></defs><path d="M1025,515 L1152,515" stroke="#5B4B9A" stroke-width="3" fill="none" marker-end="url(#a04zi4p)"/><text x="800" y="728" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Nobody in the dining room ever walks into the pantry. Everything goes through the kitchen.</text></svg>