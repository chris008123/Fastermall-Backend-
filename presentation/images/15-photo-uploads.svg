<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="800" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B4F5C" text-anchor="middle" dominant-baseline="middle">WHAT HAPPENS TO A PHOTO AN ADMIN UPLOADS</text><rect x="30" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="145" y="188.9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Upload</text><text x="145" y="221.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">JPEG, PNG or WebP, up to 5</text><text x="145" y="243.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">MB, from the admin console</text><circle cx="145" cy="108" r="20" fill="#1F7A8C"/><text x="145" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="ao1rruk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M262,215 L292,215" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ao1rruk)"/><rect x="294" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="3"/><text x="409" y="177.85000000000002" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Checked</text><text x="409" y="210.70000000000002" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Real type read from the</text><text x="409" y="232.8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">file; broken or over 40 MP</text><text x="409" y="254.90000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">refused</text><circle cx="409" cy="108" r="20" fill="#B83227"/><text x="409" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="apn8ue1" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M526,215 L556,215" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#apn8ue1)"/><rect x="558" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="673" y="177.85000000000002" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Cleaned</text><text x="673" y="210.70000000000002" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Turned upright; GPS</text><text x="673" y="232.8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">location and camera</text><text x="673" y="254.90000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">details removed</text><circle cx="673" cy="108" r="20" fill="#5B4B9A"/><text x="673" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="amf993b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M790,215 L820,215" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#amf993b)"/><rect x="822" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="3"/><text x="937" y="188.9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Resized</text><text x="937" y="221.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Longest side at most 1600</text><text x="937" y="243.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">px (never enlarged)</text><circle cx="937" cy="108" r="20" fill="#E07B2A"/><text x="937" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="ak555ai" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1054,215 L1084,215" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ak555ai)"/><rect x="1086" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1201" y="188.9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Converted</text><text x="1201" y="221.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Saved as WebP, plus a 400</text><text x="1201" y="243.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">px thumbnail</text><circle cx="1201" cy="108" r="20" fill="#2E7D4F"/><text x="1201" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><defs><marker id="ako3nz6" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1318,215 L1348,215" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ako3nz6)"/><rect x="1350" y="110" width="230" height="210" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="1465" y="188.9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Stored</text><text x="1465" y="221.75" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Public Supabase bucket,</text><text x="1465" y="243.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">cached for a year</text><circle cx="1465" cy="108" r="20" fill="#1F7A8C"/><text x="1465" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><text x="60" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B6B73" text-anchor="start" dominant-baseline="middle">A TYPICAL PHONE PHOTO</text><text x="60" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Uploaded (4000 x 3000 JPEG)</text><rect x="420" y="434" width="900" height="36" rx="8" fill="#B83227"/><text x="1336" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#B83227" text-anchor="start" dominant-baseline="middle">≈ 3 MB</text><text x="60" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Product page (1600 px WebP)</text><rect x="420" y="504" width="75" height="36" rx="8" fill="#E07B2A"/><text x="511" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#E07B2A" text-anchor="start" dominant-baseline="middle">≈ 250 KB</text><text x="60" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Product list (400 px thumbnail)</text><rect x="420" y="574" width="9" height="36" rx="8" fill="#2E7D4F"/><text x="445" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#2E7D4F" text-anchor="start" dominant-baseline="middle">≈ 30 KB</text><text x="800" y="670" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Sizes are typical, not exact. Lists load the thumbnail, so they open fast on mobile data. Older photos stay as they were.</text></svg>