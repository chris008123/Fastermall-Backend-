<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="30" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="128" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Basket</text><text x="128" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Customer picks</text><text x="128" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">products or food</text><circle cx="128" cy="178" r="20" fill="#1F7A8C"/><text x="128" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="ayzi6b4" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M228,267.5 L252,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ayzi6b4)"/><rect x="254" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="352" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Place order</text><text x="352" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Backend sets prices &amp;</text><text x="352" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">fee, holds the stock</text><circle cx="352" cy="178" r="20" fill="#1F7A8C"/><text x="352" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="a8qpbe1" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M452,267.5 L476,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a8qpbe1)"/><rect x="478" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="3"/><text x="576" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Pay</text><text x="576" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">MoMo or card through</text><text x="576" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Paystack</text><circle cx="576" cy="178" r="20" fill="#E07B2A"/><text x="576" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="ayciywm" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M676,267.5 L700,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ayciywm)"/><rect x="702" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="800" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Confirmed</text><text x="800" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Payment proven;</text><text x="800" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">delivery job opens</text><circle cx="800" cy="178" r="20" fill="#2E7D4F"/><text x="800" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="af6pb9a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M900,267.5 L924,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#af6pb9a)"/><rect x="926" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1024" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Preparing</text><text x="1024" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Shop or kitchen gets</text><text x="1024" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">it ready</text><circle cx="1024" cy="178" r="20" fill="#2E7D4F"/><text x="1024" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><defs><marker id="adzasvv" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1124,267.5 L1148,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#adzasvv)"/><rect x="1150" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="1248" y="252.77499999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">On the way</text><text x="1248" y="284.7" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">A partner carries it</text><circle cx="1248" cy="178" r="20" fill="#5B4B9A"/><text x="1248" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><defs><marker id="a0gbwha" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1348,267.5 L1372,267.5" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a0gbwha)"/><rect x="1374" y="180" width="196" height="175" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1472" y="242.04999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Delivered</text><text x="1472" y="273.97499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Customer gives the</text><text x="1472" y="295.42499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">6-digit code</text><circle cx="1472" cy="178" r="20" fill="#2E7D4F"/><text x="1472" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">7</text><text x="800" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B4F5C" text-anchor="middle" dominant-baseline="middle">A MARKETPLACE OR FOOD ORDER, FROM BASKET TO DOORSTEP</text><text x="800" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Prices, delivery fee and totals are always worked out by the backend, never trusted from the phone.</text><defs><marker id="ae8fyuv" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#B83227"/></marker></defs><path d="M576,358 L300,468" stroke="#B83227" stroke-width="3" fill="none" marker-end="url(#ae8fyuv)" stroke-dasharray="8 6"/><rect x="40" y="475" width="490" height="150" rx="18" fill="#F9E0DD" stroke="#B83227" stroke-width="2"/><text x="285" y="513.825" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Never paid?</text><text x="285" y="545.1500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">After 30 minutes (24 h if payment was started) the order</text><text x="285" y="566.6000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">is cancelled automatically and the stock goes back on the</text><text x="285" y="588.0500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">shelf.</text><defs><marker id="as9vi6z" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#B7791F"/></marker></defs><path d="M800,358 L800,468" stroke="#B7791F" stroke-width="3" fill="none" marker-end="url(#as9vi6z)" stroke-dasharray="8 6"/><rect x="555" y="475" width="490" height="150" rx="18" fill="#FCF1D6" stroke="#B7791F" stroke-width="2"/><text x="800" y="513.825" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Customer cancels?</text><text x="800" y="545.1500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Allowed before preparing starts. Stock returns and a paid</text><text x="800" y="566.6000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">order is refunded automatically; if that fails, every</text><text x="800" y="588.0500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">admin is alerted.</text><rect x="1070" y="475" width="490" height="150" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="1315" y="514.8" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Good to know: delivery windows</text><text x="1315" y="545.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Marketplace orders get a slot: before 9:00 → same morning,</text><text x="1315" y="566.5999999999999" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">9:00–14:59 → afternoon, later → next morning. Can be moved</text><text x="1315" y="587.4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">twice.</text><text x="800" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Retrying a slow request is safe: an “idempotency key” stops the same order being created twice.</text><text x="800" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">Every step sends the customer a notification (in-app list + phone push).</text></svg>