<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="800" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B4F5C" text-anchor="middle" dominant-baseline="middle">HOW A NEW DELIVERY PARTNER JOINS</text><rect x="30" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="128" y="203.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Apply</text><text x="128" y="234.425" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Fills in name, phone,</text><text x="128" y="255.875" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">ID details and</text><text x="128" y="277.325" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">walking/motorcycle in</text><text x="128" y="298.775" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">the Delivery app</text><circle cx="128" cy="128" r="20" fill="#1F7A8C"/><text x="128" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="aeo3807" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M228,250 L252,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aeo3807)"/><rect x="254" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="3"/><text x="352" y="224.54999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Admin reviews</text><text x="352" y="255.875" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Approves or rejects</text><text x="352" y="277.325" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">with a reason</text><circle cx="352" cy="128" r="20" fill="#B83227"/><text x="352" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="aua2jss" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M452,250 L476,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aua2jss)"/><rect x="478" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="576" y="213.825" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Account made</text><text x="576" y="245.14999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">A delivery-partner</text><text x="576" y="266.59999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">login is created</text><text x="576" y="288.04999999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">automatically</text><circle cx="576" cy="128" r="20" fill="#2E7D4F"/><text x="576" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="an3ssoq" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M676,250 L700,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#an3ssoq)"/><rect x="702" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="3"/><text x="800" y="224.54999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Email with code</text><text x="800" y="255.875" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">A one-time setup code,</text><text x="800" y="277.325" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">valid for a few days</text><circle cx="800" cy="128" r="20" fill="#E07B2A"/><text x="800" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="abittsk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M900,250 L924,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#abittsk)"/><rect x="926" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="1024" y="213.825" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Sets password</text><text x="1024" y="245.14999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Partner chooses their</text><text x="1024" y="266.59999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">own password with the</text><text x="1024" y="288.04999999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">code</text><circle cx="1024" cy="128" r="20" fill="#5B4B9A"/><text x="1024" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><defs><marker id="auj91fw" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1124,250 L1148,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#auj91fw)"/><rect x="1150" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="1248" y="211.95" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Uploads</text><text x="1248" y="237.14999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">documents</text><text x="1248" y="268.47499999999997" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">ID, licence, photo –</text><text x="1248" y="289.92499999999995" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">checked by admin</text><circle cx="1248" cy="128" r="20" fill="#5B4B9A"/><text x="1248" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><defs><marker id="aeyrziu" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1348,250 L1372,250" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aeyrziu)"/><rect x="1374" y="130" width="196" height="240" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1472" y="235.275" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Goes online</text><text x="1472" y="266.6" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Starts claiming jobs</text><circle cx="1472" cy="128" r="20" fill="#2E7D4F"/><text x="1472" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">7</text><rect x="30" y="430" width="760" height="170" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="410" y="488.9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Why a code instead of a password in the email?</text><text x="410" y="519.9499999999999" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Nobody, not even the admin, ever knows the partner’s password. If the email fails,</text><text x="410" y="542.05" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">the partner can ask for a new code or an admin can set one.</text><rect x="810" y="430" width="760" height="170" rx="18" fill="#F9E0DD" stroke="#B83227" stroke-width="2"/><text x="1190" y="488.9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Staff accounts can be switched off instantly</text><text x="1190" y="519.9499999999999" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Each staff login is a “session” checked on every request. Logging out, a password</text><text x="1190" y="542.05" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">reset or deactivation ends it immediately.</text></svg>