<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="40" y="70" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2.5"/><text x="175" y="148.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Name tag</text><text x="175" y="181.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Every request gets a tracking</text><text x="175" y="204.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">number (X-Request-Id)</text><circle cx="68" cy="98" r="19" fill="#1F7A8C"/><text x="68" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="a8dibt5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M313,175 L346,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a8dibt5)"/><rect x="350" y="70" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2.5"/><text x="485" y="148.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Safety headers</text><text x="485" y="181.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Standard browser protections</text><text x="485" y="204.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">are added</text><circle cx="378" cy="98" r="19" fill="#1F7A8C"/><text x="378" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="ak2df6i" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M623,175 L656,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ak2df6i)"/><rect x="660" y="70" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="2.5"/><text x="795" y="148.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Speed limit</text><text x="795" y="181.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Too many tries in a minute?</text><text x="795" y="204.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Told to slow down</text><circle cx="688" cy="98" r="19" fill="#B83227"/><text x="688" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="atpk32z" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M933,175 L966,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#atpk32z)"/><rect x="970" y="70" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="2.5"/><text x="1105" y="148.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Who are you?</text><text x="1105" y="181.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">The login token (JWT) is</text><text x="1105" y="204.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">checked</text><circle cx="998" cy="98" r="19" fill="#B83227"/><text x="998" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="aos5pog" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1243,175 L1276,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aos5pog)"/><rect x="1280" y="70" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="2.5"/><text x="1415" y="148.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Allowed?</text><text x="1415" y="181.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Your role must match (e.g.</text><text x="1415" y="204.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">ADMIN only)</text><circle cx="1308" cy="98" r="19" fill="#B83227"/><text x="1308" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><rect x="1280" y="430" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><text x="1415" y="508.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Form check</text><text x="1415" y="541.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Bad or unknown fields are</text><text x="1415" y="564.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">rejected</text><circle cx="1308" cy="458" r="19" fill="#B7791F"/><text x="1308" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><defs><marker id="agp0jqk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1277,535 L1244,535" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#agp0jqk)"/><rect x="970" y="430" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.5"/><text x="1105" y="508.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Do the work</text><text x="1105" y="541.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">The department applies its</text><text x="1105" y="564.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">rules</text><circle cx="998" cy="458" r="19" fill="#2E7D4F"/><text x="998" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">7</text><defs><marker id="anhnhzo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M967,535 L934,535" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#anhnhzo)"/><rect x="660" y="430" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="2.5"/><text x="795" y="508.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Pantry</text><text x="795" y="541.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Data is read or saved in the</text><text x="795" y="564.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">database</text><circle cx="688" cy="458" r="19" fill="#E07B2A"/><text x="688" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">8</text><defs><marker id="akrelcs" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M657,535 L624,535" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#akrelcs)"/><rect x="350" y="430" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2.5"/><text x="485" y="508.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Reply</text><text x="485" y="541.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Same tidy answer shape every</text><text x="485" y="564.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">time</text><circle cx="378" cy="458" r="19" fill="#1F7A8C"/><text x="378" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">9</text><defs><marker id="a4s4502" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M347,535 L314,535" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a4s4502)"/><rect x="40" y="430" width="270" height="210" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="2.5"/><text x="175" y="508.25" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Logbook</text><text x="175" y="541.425" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Admin changes are written to</text><text x="175" y="564.175" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">the audit log</text><circle cx="68" cy="458" r="19" fill="#5B4B9A"/><text x="68" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">10</text><defs><marker id="atrc5hb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1415,283 L1415,424" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#atrc5hb)"/><text x="800" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#B83227" text-anchor="middle" dominant-baseline="middle" font-style="italic">If any red step says no, the request stops right there and gets a clear error – nothing is saved.</text><text x="800" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">This happens for every single tap in every app, usually in a fraction of a second.</text></svg>