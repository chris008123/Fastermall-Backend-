very</text><circle cx="371" cy="582" r="6" fill="#E07B2A"/><text x="387" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Cashes out the wallet</text><rect x="655" y="40" width="290" height="620" rx="18" fill="#DFF2E6" stroke="#2E7D4F" stroke-width="2"/><circle cx="800" cy="120" r="46" fill="#2E7D4F"/><circle cx="800" cy="106" r="16" fill="#fff"/><path d="M772,146 a28,24 0 0 1 56,0 z" fill="#fff"/><text x="800" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2E7D4F" text-anchor="middle" dominant-baseline="middle">Vendor</text><text x="800" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">uses the Admin / partner tools</text><circle cx="683" cy="292" r="6" fill="#2E7D4F"/><text x="699" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Owns a food stall</text><circle cx="683" cy="350" r="6" fill="#2E7D4F"/><text x="699" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Edits its own menu</text><circle cx="683" cy="408" r="6" fill="#2E7D4F"/><text x="699" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Adds options and extras</text><circle cx="683" cy="466" r="6" fill="#2E7D4F"/><text x="699" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">(e.g. "extra egg +GH₵2")</text><rect x="967" y="40" width="290" height="620" rx="18" fill="#E9E5F6" stroke="#5B4B9A" stroke-width="2"/><circle cx="1112" cy="120" r="46" fill="#5B4B9A"/><circle cx=