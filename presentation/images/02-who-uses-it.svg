seline="middle" font-style="italic">uses the Admin console</text><circle cx="1307" cy="292" r="6" fill="#B83227"/><text x="1323" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Sees everything</text><circle cx="1307" cy="350" r="6" fill="#B83227"/><text x="1323" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Approves partners</text><circle cx="1307" cy="408" r="6" fill="#B83227"/><text x="1323" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Sets fees and settings</text><circle cx="1307" cy="466" r="6" fill="#B83227"/><text x="1323" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Refunds payments</text><circle cx="1307" cy="524" r="6" fill="#B83227"/><text x="1323" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Sends announcements</text><circle cx="1307" cy="582" r="6" fill="#B83227"/><text x="1323" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Every change is logged</text></svg>