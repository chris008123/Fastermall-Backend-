<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="31" y="40" width="290" height="620" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><circle cx="176" cy="120" r="46" fill="#1F7A8C"/><circle cx="176" cy="106" r="16" fill="#fff"/><path d="M148,146 a28,24 0 0 1 56,0 z" fill="#fff"/><text x="176" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1F7A8C" text-anchor="middle" dominant-baseline="middle">Customer</text><text x="176" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle" font-style="italic">uses the Customer app</text><circle cx="59" cy="292" r="6" fill="#1F7A8C"/><text x="75" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Shops the marketplace</text><circle cx="59" cy="350" r="6" fill="#1F7A8C"/><text x="75" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Orders food with add-ons</text><circle cx="59" cy="408" r="6" fill="#1F7A8C"/><text x="75" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Books laundry pickups</text><circle cx="59" cy="466" r="6" fill="#1F7A8C"/><text x="75" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Pays by MoMo or card</text><circle cx="59" cy="524" r="6" fill="#1F7A8C"/><text x="75" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Requests custom pre-orders</text><circle cx="59" cy="582" r="6" fill="#1F7A8C"/>