serif" font-size="20" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Strict form checks: unknown fields are refused</text><circle cx="470" cy="334" r="20" fill="#1F7A8C"/><text x="470" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="930" cy="442" r="22" fill="#1F7A8C"/><text x="930" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><text x="970" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">Business rules: you only see your own orders,</text><text x="970" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">staff only their laundry</text><rect x="900" y="540" width="670" height="230" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="1235" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F7A8C" text-anchor="middle" dominant-baseline="middle">PLUS</text><text x="1235" y="622" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Passwords &amp; codes stored scrambled (bcrypt)</text><text x="1235" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Accounts lock after 5 wrong passwords</text><text x="1235" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Paystack messages verified by signature</text><text x="1235" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="400" 