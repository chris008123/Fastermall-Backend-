<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="70" y="20" width="320" height="80" rx="18" fill="#F0F8F9" stroke="#1F7A8C" stroke-width="2"/><text x="230" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Customer app</text><line x1="230" y1="100" x2="230" y2="800" stroke="#1F7A8C" stroke-width="3" stroke-dasharray="6 8"/><rect x="640" y="20" width="320" height="80" rx="18" fill="#DCEFF2" stroke="#0B4F5C" stroke-width="2"/><text x="800" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Backend</text><line x1="800" y1="100" x2="800" y2="800" stroke="#0B4F5C" stroke-width="3" stroke-dasharray="6 8"/><rect x="1210" y="20" width="320" height="80" rx="18" fill="#E9E5F6" stroke="#5B4B9A" stroke-width="2"/><text x="1370" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Paystack</text><line x1="1370" y1="100" x2="1370" y2="800" stroke="#5B4B9A" stroke-width="3" stroke-dasharray="6 8"/><defs><marker id="ala5qka" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0B4F5C"/></marker></defs><path d="M242,160 L786,160" stroke="#0B4F5C" stroke-width="3" fill="none" marker-end="url(#ala5qka)"/><text x="515" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle" stroke="#FFFFFF" stroke-width="10" paint-order="stroke" stroke-linejoin="round">1. "I want to pay for order #123 with MoMo"</text><rect x="790" y="220" width="20" height="44" fill="#0B4F5C"/><text x="830" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">2. Looks up the amount from the saved order (the phone</text><text x="830" y="265.75" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">cannot change it)</text><defs><marker id="axnzvqx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0B4F5C"/></marker></defs><path d="M812,324 L1356,324" stroke="#0B4F5C" stroke-width="3" fill="none" marker-end="url(#axnzvqx)"/><text x="1085" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle" stroke="#FFFFFF" stroke-width="10" paint-order="stroke" stroke-linejoin="round">3. "Start a payment of GH₵ X, reference FM-…"</text><defs><marker id="aswj9is" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B4B9A"/></marker></defs><path d="M1358,406 L244,406" stroke="#5B4B9A" stroke-width="3" fill="none" marker-end="url(#aswj9is)"/><text x="800" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle" stroke="#FFFFFF" stroke-width="10" paint-order="stroke" stroke-linejoin="round">4. Customer approves on Paystack’s secure page / phone prompt</text><defs><marker id="ajawihr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B4B9A"/></marker></defs><path d="M1358,488 L814,488" stroke="#5B4B9A" stroke-width="3" fill="none" marker-end="url(#ajawihr)"/><text x="1085" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle" stroke="#FFFFFF" stroke-width="10" paint-order="stroke" stroke-linejoin="round">5. Webhook: "payment done" – signed with a secret</text><rect x="790" y="548" width="20" height="44" fill="#0B4F5C"/><text x="830" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">6. Signature checked, then asks Paystack again to confirm</text><rect x="790" y="630" width="20" height="44" fill="#0B4F5C"/><text x="830" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="start" dominant-baseline="middle">7. Amount and currency must match exactly, else refused</text><defs><marker id="ailr65e" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#0B4F5C"/></marker></defs><path d="M788,734 L244,734" stroke="#0B4F5C" stroke-width="3" fill="none" marker-end="url(#ailr65e)"/><text x="515" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle" stroke="#FFFFFF" stroke-width="10" paint-order="stroke" stroke-linejoin="round">8. Marked PAID once; delivery job created; customer notified</text></svg>