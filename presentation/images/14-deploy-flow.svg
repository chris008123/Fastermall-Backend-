<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="30" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="128" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Write code</text><text x="128" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">on a laptop, with tests</text><circle cx="128" cy="88" r="20" fill="#1F7A8C"/><text x="128" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><defs><marker id="amw90fy" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M228,175 L252,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#amw90fy)"/><rect x="254" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="352" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Run tests</text><text x="352" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">npm test – 708 checks</text><circle cx="352" cy="88" r="20" fill="#2E7D4F"/><text x="352" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><defs><marker id="ai2ppv9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M452,175 L476,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#ai2ppv9)"/><rect x="478" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="3"/><text x="576" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Push to GitHub</text><text x="576" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">main branch</text><circle cx="576" cy="88" r="20" fill="#1F7A8C"/><text x="576" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><defs><marker id="aw632re" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M676,175 L700,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#aw632re)"/><rect x="702" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#5B4B9A" stroke-width="3"/><text x="800" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Render builds</text><text x="800" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">npm ci &amp;&amp; npm run build</text><circle cx="800" cy="88" r="20" fill="#5B4B9A"/><text x="800" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><defs><marker id="a25apgz" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M900,175 L924,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#a25apgz)"/><rect x="926" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#E07B2A" stroke-width="3"/><text x="1024" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Update database</text><text x="1024" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">prisma migrate deploy</text><circle cx="1024" cy="88" r="20" fill="#E07B2A"/><text x="1024" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">5</text><defs><marker id="absexx8" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1124,175 L1148,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#absexx8)"/><rect x="1150" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><text x="1248" y="160.6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Go live</text><text x="1248" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">npm run start:prod</text><circle cx="1248" cy="88" r="20" fill="#2E7D4F"/><text x="1248" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">6</text><defs><marker id="acroqcb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#5B6B73"/></marker></defs><path d="M1348,175 L1372,175" stroke="#5B6B73" stroke-width="3" fill="none" marker-end="url(#acroqcb)"/><rect x="1374" y="90" width="196" height="170" rx="18" fill="#FFFFFF" stroke="#B83227" stroke-width="3"/><text x="1472" y="150.2" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Smoke test</text><text x="1472" y="181.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">quick checks from</text><text x="1472" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">DEPLOYMENT.md</text><circle cx="1472" cy="88" r="20" fill="#B83227"/><text x="1472" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">7</text><rect x="30" y="320" width="760" height="190" rx="18" fill="#FDEBDC" stroke="#E07B2A" stroke-width="2"/><text x="410" y="388.90000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Back up first</text><text x="410" y="420.55" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Take a Supabase backup before every release. All migrations in this release only add</text><text x="410" y="442.65000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">things, but a backup makes any mistake reversible.</text><rect x="810" y="320" width="760" height="190" rx="18" fill="#F9E0DD" stroke="#B83227" stroke-width="2"/><text x="1190" y="388.90000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D2B33" text-anchor="middle" dominant-baseline="middle">Secrets never go in Git</text><text x="1190" y="420.55" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">Passwords and keys live only in Render’s settings and a local .env file (which Git</text><text x="1190" y="442.65000000000003" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6B73" text-anchor="middle" dominant-baseline="middle">ignores). The server refuses to start in production with unsafe values.</text></svg>